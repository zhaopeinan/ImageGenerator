<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      favicon
      - svg  现代浏览器优先，任意尺寸清晰
      - 32/16 png 兜底（部分环境不解析 svg）
      - ico        老浏览器与部分工具只认它
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="shortcut icon" href="/favicon-32.png" />
    <!-- iOS 主屏：系统自己加圆角，所以图标本身不做圆角 -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>神笔</title>
    <meta name="description" content="神笔 — 本地优先的图像生成与精修" />
    <meta name="theme-color" content="#f6f6f4" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
